      - type: object
        properties:
          label:
            type: string
          resource:
            type: object
            required:
            - id
            - _links
            properties:
              id:
                type: string
              _links:
                type: object
                properties:
                  self:
                    type: string
                    description: Link to a resource.
      description: The value of a scalar metric.
