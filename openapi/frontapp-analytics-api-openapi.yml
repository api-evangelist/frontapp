openapi: 3.2.0
info:
  version: 1.0.0
  title: Core Analytics API
  contact:
    name: Front Platform
    url: https://community.front.com
servers:
- url: https://api2.frontapp.com
security:
- http: []
tags:
- name: Analytics
paths:
  /analytics/exports:
    post:
      summary: Create a new analytics export
      operationId: create-analytics-export
      description: 'Create a new analytics export of messages or events (activities) over a specific time span.

        The export will be executed asynchronously. The response will include a link that can be used to retrieve the export status & result. Refer to the Analytics topic for details about specific metrics.


        Required scope: `analytics:read`'
      tags:
      - Analytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsExportRequest'
      responses:
        '201':
          description: An analytics export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsExportResponse'
      x-required-scopes:
      - analytics:read
  /analytics/exports/{export_id}:
    get:
      summary: Fetch an analytics export
      operationId: get-analytics-export
      description: 'Fetch an analytics exports. Refer to the Analytics topic for details about specific metrics.


        Required scope: `analytics:read`'
      tags:
      - Analytics
      parameters:
      - in: path
        name: export_id
        required: true
        description: The export ID.
        schema:
          type: string
          default: exp_123
      responses:
        '200':
          description: An analytics export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsExportResponse'
      x-required-scopes:
      - analytics:read
  /analytics/reports:
    post:
      summary: Create a new analytics report
      operationId: create-analytics-report
      description: 'Create a new analytics report for a set of metrics over a specific time span. Different filters (e.g. Inbox v Tag v Teammates) will be joined with AND logic, but the IDs within a filter will be joined with OR logic (e.g. Inbox A or Inbox B, Tag A or Tag B).

        The report will be executed asynchronously. The response will include a link that can be used to retrieve the

        report status & result. Refer to the Analytics topic for details about specific metrics.


        Required scope: `analytics:read`'
      tags:
      - Analytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsReportRequest'
      responses:
        '201':
          description: An analytics report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReportResponse'
      x-required-scopes:
      - analytics:read
  /analytics/reports/{report_uid}:
    get:
      summary: Fetch an analytics report
      operationId: get-analytics-report
      description: 'Fetch an analytics report. Refer to the Analytics topic for details about specific metrics.


        Required scope: `analytics:read`'
      tags:
      - Analytics
      parameters:
      - in: path
        name: report_uid
        required: true
        description: The report UID.
        schema:
          type: string
          default: 723ec32796f12c6f05f6b124d8ef76191a38cec990e0f65d549206c51373f1a0
      responses:
        '200':
          description: An analytics report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReportResponse'
      x-required-scopes:
      - analytics:read
