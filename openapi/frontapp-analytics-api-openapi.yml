          - Transitions to Ticket Status
          - Custom Field
          - Updated Custom Field
        id:
          description: Public API string ID (e.g., sts_123 for ticket statuses, fld_456 for custom fields) or legacy numeric ID
          oneOf:
          - type: string
          - type: integer
