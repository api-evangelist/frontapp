aid: frontapp

name: FrontApp

description: Front is a customer service and communication platform that combines the efficiency of a help desk with the familiarity of email,
  giving teams a shared inbox across email, SMS, chat, and social channels. The Front Core API is a REST API (base https://api2.frontapp.com)
  exposing 340+ endpoints across conversations, messages, drafts, comments, contacts, accounts, inboxes, channels, tags, teammates, teams, knowledge
  bases, shifts, analytics, links, message templates, and signatures. It supports API-token and OAuth 2.0 authentication with 50+ granular scopes,
  cursor pagination, per-company rate limiting with standard headers, webhooks and application triggers for events, and an official hosted MCP
  server for AI agents. Front is a portfolio company of Battery Ventures.

